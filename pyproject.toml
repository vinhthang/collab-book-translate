[project]
name = "collab-book-translate"
version = "0.1.0"
description = "Collaborative multi-agent book translation on GitHub"
requires-python = ">=3.10"
dependencies = [
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.0",
    "python-docx>=1.1.0",
    "mobi>=0.3.3",
    "markdown>=3.6",
    "lxml>=5.2.0",
    "pypinyin>=0.51.0",
    "pymupdf>=1.24.0",
    "weasyprint>=62.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
