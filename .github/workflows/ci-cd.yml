name: Build & Publish collab-mcp Container Image

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Container image tag to publish (e.g. v0.9.1)"
        required: false
        default: "v0.9.1"
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system runtime libraries & Node.js
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libpangoft2-1.0-0 libgdk-pixbuf-2.0-0 \
            libharfbuzz-subset0 shared-mime-info nodejs

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Run pytest suite
        run: uv run pytest -q

      - name: Validate Admin UI JavaScript syntax
        run: |
          uv run python -c "from scripts.mcp_server.admin_ui import _ADMIN_JS; print(_ADMIN_JS)" > /tmp/admin.js
          node --check /tmp/admin.js

  build-arm64:
    needs: [test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, push, and verify anonymous GHCR pullability
        run: |
          TAG="${{ inputs.image_tag || 'v0.9.1' }}"
          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            --sbom=false \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -t "ghcr.io/vinhthang/collab-book-translate:${TAG}" \
            -t "ghcr.io/vinhthang/collab-book-translate:latest" \
            --push .

          if docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            --sbom=false \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -t "ghcr.io/vinhthang/collab-mcp:${TAG}" \
            --push .; then
            echo "Pushed ghcr.io/vinhthang/collab-mcp:${TAG}"
          else
            echo "Note: standalone ghcr.io/vinhthang/collab-mcp package push skipped/denied."
          fi

          check_public() {
            local pkg="$1"
            local tok_json tok status
            tok_json=$(curl -fsS "https://ghcr.io/token?scope=repository:${pkg}:pull" || true)
            tok=$(python3 -c 'import json,sys; d=json.loads(sys.stdin.read() or "{}"); print(d.get("token",""))' <<< "$tok_json")
            if [ -z "$tok" ]; then
              return 1
            fi
            status=$(curl -s -o /dev/null -w "%{http_code}" -I \
              -H "Authorization: Bearer ${tok}" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://ghcr.io/v2/${pkg}/manifests/${TAG}" || echo "000")
            echo "Anonymous check ${pkg}:${TAG} -> HTTP ${status}"
            [ "$status" = "200" ]
          }

          if check_public "vinhthang/collab-mcp"; then
            VERIFIED_PKG="vinhthang/collab-mcp"
            echo "VERIFIED_PUBLIC_IMAGE=ghcr.io/vinhthang/collab-mcp:${TAG}"
          elif check_public "vinhthang/collab-book-translate"; then
            VERIFIED_PKG="vinhthang/collab-book-translate"
            echo "VERIFIED_PUBLIC_IMAGE=ghcr.io/vinhthang/collab-book-translate:${TAG}"
          else
            echo "ERROR_PACKAGE_NOT_PUBLIC: Neither vinhthang/collab-mcp:${TAG} nor vinhthang/collab-book-translate:${TAG} is anonymously pullable."
            exit 1
          fi
          echo "VERIFIED_PKG=${VERIFIED_PKG}" >> "$GITHUB_ENV"
          echo "PUBLISHED_TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Trigger OCI Fleet Rollout (collab-mcp)
        if: github.event_name != 'pull_request'
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          TAG="${PUBLISHED_TAG:-${{ inputs.image_tag || 'v0.9.1' }}}"
          PKG="${VERIFIED_PKG:-vinhthang/collab-mcp}"
          TOK=$(curl -fsS "https://ghcr.io/token?scope=repository:${PKG}:pull" | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])')
          DIGEST=$(curl -fsSI \
            -H "Authorization: Bearer ${TOK}" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/${PKG}/manifests/${TAG}" \
            | awk 'tolower($1)=="docker-content-digest:" {gsub("\r","",$2); print $2}')
          PAYLOAD=$(python3 -c 'import json,sys; tag,dig=sys.argv[1:3]; d={"service":"collab-mcp","tag":tag}; d.update({"digest":dig} if dig.startswith("sha256:") else {}); print(json.dumps(d))' "$TAG" "$DIGEST")
          echo "Triggering rollout on webhook.vinhthang.dev: ${PAYLOAD}"
          curl -fsS -X POST "https://webhook.vinhthang.dev/deploy" \
            -H "Authorization: Bearer ${WEBHOOK_SECRET}" \
            -H "Content-Type: application/json" \
            --data-binary "$PAYLOAD"
